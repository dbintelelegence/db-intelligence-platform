services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/db_intelligence

      # Grafana Cloud — GCP Prod stack (set in .env or shell env)
      GRAFANA_GCP_PROD_URL: ${GRAFANA_GCP_PROD_URL:-}
      GRAFANA_GCP_PROD_INSTANCE_ID: ${GRAFANA_GCP_PROD_INSTANCE_ID:-}
      GRAFANA_GCP_PROD_API_KEY: ${GRAFANA_GCP_PROD_API_KEY:-}

      # LLM — used by verdict writer and AI chat proxy
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_analyzers.py &&
             python scripts/seed_normalisation.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
